name: Build LinDOS x86_64 Components

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex

    - name: Compile BusyBox for x86_64
      run: |
        cd tools/busybox-1.36.1
        make defconfig
        make -j$(nproc)

    - name: Upload Compiled Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-x86_64
        path: tools/busybox-1.36.1/busybox
