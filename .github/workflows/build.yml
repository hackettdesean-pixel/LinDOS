name: Build LinDOS x86_64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex

      - name: Configure BusyBox
        run: |
          cd path/to/busybox/source  # Make sure this is your actual BusyBox folder
          make defconfig             # Use defconfig instead of olddefconfig

      - name: Compile BusyBox
        run: |
          cd path/to/busybox/source
          make -j$(nproc)


