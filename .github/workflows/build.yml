name: Build LinDOS x86_64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex

      - name: Get BusyBox source
        run: |
          # Skip this clone command if your BusyBox source code is already inside your repository
          git clone https://git.busybox.net/busybox
          cd busybox

      - name: Configure BusyBox (Default Config)
        run: |
          # Change directory into where your busybox folder is located
          cd busybox  # Change this if your folder name/path is different
          make defconfig

      - name: Compile BusyBox
        run: |
          cd busybox  # Keep matching the directory path
          make -j$(nproc)


