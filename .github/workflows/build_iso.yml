name: Build LinDOS x86_64 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools cpio gzip

      - name: Fix Permissions
        run: |
          chmod -R +x tools/
          chmod -R +x scripts/ 2>/dev/null || true

      - name: Compile BusyBox Core (Static)
        run: |
          cd tools/busybox-1.36.1
          if [ ! -f .config ]; then make defconfig; fi
          sed -i 's/CONFIG_TC=y/# CONFIG_TC is not set/' .config
          sed -i 's/CONFIG_FEATURE_TC_INGRESS=y/# CONFIG_FEATURE_TC_INGRESS is not set/' .config
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          make -j$(nproc)
          echo "---- Link check ----"
          file busybox
          if file busybox | grep -q "dynamically linked"; then
            echo "ERROR: busybox is dynamically linked, initramfs will panic on boot"
            exit 1
          fi

      - name: Build RAM Disk (Initramfs) & Fetch Kernel
        run: |
          mkdir -p iso_root/boot/grub
          rm -rf initramfs
          mkdir -p initramfs/{bin,sbin,etc,proc,sys,dev,usr/bin,usr/sbin}

          cp tools/busybox-1.36.1/busybox initramfs/bin/busybox
          chmod +x initramfs/bin/busybox

          cd initramfs/bin
          ./busybox --install -s .
          cd ../..

          cat << 'INITSCRIPT' > initramfs/init
#!/bin/sh
mount -t proc none /proc
mount -t sysfs none /sys
mount -t devtmpfs none /dev 2>/dev/null || true

clear
echo "================================================="
echo "   Welcome to LinDOS x86_64 Live Shell!          "
echo "================================================="
echo ""
exec /bin/sh
INITSCRIPT
          chmod +x initramfs/init

          cd initramfs
          find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../iso_root/boot/initrd.img
          cd ..

          KERNEL_PATH=$(ls -1 /boot/vmlinuz-* | head -n 1)
          sudo cp "$KERNEL_PATH" iso_root/boot/vmlinuz
          sudo chmod 644 iso_root/boot/vmlinuz

      - name: Configure GRUB Bootloader
        run: |
          cat << 'CFG' > iso_root/boot/grub/grub.cfg
          insmod all_video
          insmod efi_gop
          insmod efi_uga
          set gfxpayload=keep
          set timeout=5
          set default=0

          menuentry "LinDOS x86_64 Live Shell" {
              echo "Loading LinDOS Linux Kernel..."
              linux /boot/vmlinuz console=tty0 quiet
              echo "Loading LinDOS Initial RAM Disk..."
              initrd /boot/initrd.img
          }

          menuentry "Reboot" {
              reboot
          }
          CFG

      - name: Generate Hybrid Bootable ISO
        run: |
          grub-mkrescue /usr/lib/grub/i386-pc /usr/lib/grub/x86_64-efi -o LinDOS-x86_64.iso iso_root/ -- -volid "LINDOS"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinDOS-x86_64-ISO
          path: LinDOS-x86_64.iso
