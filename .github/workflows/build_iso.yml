name: Build LinDOS x86_64 ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux-utils

      - name: Fix Permissions
        run: |
          chmod -R +x tools/
          chmod -R +x scripts/ 2>/dev/null || true

      - name: Compile BusyBox Core
        run: |
          cd tools/busybox-1.36.1
          if [ ! -f .config ]; then make defconfig; fi
          sed -i 's/CONFIG_TC=y/# CONFIG_TC is not set/' .config
          sed -i 's/CONFIG_FEATURE_TC_INGRESS=y/# CONFIG_FEATURE_TC_INGRESS is not set/' .config
          make -j$(nproc)

      - name: Assemble Filesystem & Bootloader
        run: |
          mkdir -p iso_root/boot/grub
          mkdir -p iso_root/bin
          mkdir -p iso_root/EFI/BOOT

          # Copy BusyBox
          cp tools/busybox-1.36.1/busybox iso_root/bin/
          chmod +x iso_root/bin/busybox
          
          # Create system init link pointing to BusyBox
          ln -s /bin/busybox iso_root/init

          # Create robust GRUB boot configuration for UEFI
          cat << 'CFG' > iso_root/boot/grub/grub.cfg
          insmod all_video
          insmod efi_gop
          insmod efi_uga
          set gfxpayload=keep
          set timeout=10
          set default=0

          menuentry "LinDOS x86_64 (UEFI Hybrid Mode)" {
              echo "GRUB loaded successfully!"
              echo "Booting LinDOS structure..."
              sleep 3
          }

          menuentry "Reboot" {
              reboot
          }
          CFG

      - name: Generate Hybrid Bootable ISO
        run: |
          grub-mkrescue /usr/lib/grub/i386-pc /usr/lib/grub/x86_64-efi -o LinDOS-x86_64.iso iso_root/ -- -volid "LINDOS"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinDOS-x86_64-ISO
          path: LinDOS-x86_64.iso
