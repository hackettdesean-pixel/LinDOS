search --set=root --file /.disk/2026-07-28-05-59-23-00.uuid
set prefix=(${root})/boot/grub
insmod part_acorn
insmod part_amiga
insmod part_apple
insmod part_bsd
insmod part_dfly
insmod part_dvh
insmod part_gpt
insmod part_msdos
insmod part_plan
insmod part_sun
insmod part_sunpc
insmod multiboot2

set timeout=5
set default=0

menuentry "LinDOS Prime (Multiboot2)" {
    multiboot2 /boot/kernel
    boot
}
